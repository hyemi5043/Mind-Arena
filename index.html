<style>

  --radius: 14px;

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; -webkit-text-size-adjust: 100%; }
body { min-height: 100dvh; }
button { font: inherit; color: inherit; }
a { color: var(--teal); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
input, select { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; min-height: 42px; transition: transform .06s, background .15s, border-color .15s; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.btn:hover { border-color: #3a4456; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.teal { background: var(--teal); color: #062420; border-color: var(--teal); }
.btn.danger { background: transparent; color: var(--danger); border-color: #5a2b2b; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 32px; padding: 6px 10px; font-size: 13px; }
.btn.lg { min-height: 52px; padding: 12px 22px; font-size: 16px; }
.btn.on { border-color: var(--accent); color: var(--accent); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(13,16,21,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 58px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .08em; cursor: pointer; }
.logo b { color: var(--accent); }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 600; }
.nav button.on { color: var(--text); background: var(--surface); }
.spacer { flex: 1; }
.chip-user { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-weight: 700; font-size: 13px; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.rating { font-family: var(--mono); color: var(--accent); font-size: 13px; }

.hero { padding: 36px 0 18px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: end; }
.hero h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); margin: 10px 0 0; line-height: 1.6; }
.joinbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.joinbox label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 8px; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; min-width: 0; }
#jcode { font-family: var(--mono); letter-spacing: .25em; text-transform: uppercase; font-size: 18px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 14px; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.pill.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding-bottom: 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .1s; position: relative; min-height: 150px; }
.card:hover { border-color: #3d4759; transform: translateY(-2px); }
.card .origin { font-size: 12px; color: var(--muted); }
.card h3 { font-size: 18px; }
.card p { margin: 0; color: #b7bfcc; font-size: 13px; line-height: 1.5; flex: 1; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--surface2); color: var(--muted); font-weight: 700; }
.tag.main { color: #f2b33d; } .tag.prison { color: #ef6b6b; } .tag.final { color: #c29bff; } .tag.hidden { color: #4fd1c5; } .tag.prize { color: #7fb4ff; } .tag.exile { color: #ffa27a; }
.tag.rk { background: #2b2412; color: var(--accent); }
.card.soon { cursor: default; opacity: .55; min-height: 0; }
.card.soon:hover { transform: none; border-color: var(--line); }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.section-title h2 { font-size: 18px; }
.section-title span { color: var(--muted); font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; max-width: 560px; width: 100%; max-height: 90dvh; overflow: auto; padding: 22px; }
.modal h2 { font-size: 24px; margin: 4px 0 8px; }
.rules { margin: 14px 0; padding-left: 20px; line-height: 1.65; color: #cdd3dd; }
.rules li { margin-bottom: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
@keyframes fade { from { opacity: 0; } }

/* 로그인 */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: radial-gradient(1200px 500px at 50% -10%, #2a2210 0%, transparent 60%), var(--bg); }
.login .box { width: 100%; max-width: 400px; text-align: center; }
.login h1 { font-size: 40px; letter-spacing: .12em; }
.login h1 b { color: var(--accent); }
.login .sub { color: var(--muted); margin: 8px 0 28px; line-height: 1.6; }
.login .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 18px 0; }
.login .divider::before, .login .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.gbtn { display: flex; justify-content: center; min-height: 44px; }

/* 대기실 */
.lobby { padding: 24px 16px 40px; display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
.codebox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.code { font-family: var(--mono); font-size: 38px; letter-spacing: .25em; color: var(--accent); font-weight: 800; }
.plist { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; }
.pitem .nm { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: #555; }

/* 플레이 화면 */
.play { display: grid; grid-template-columns: 1fr 300px; gap: 14px; padding: 14px 16px 24px; align-items: start; }
.gamehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.gamehead h2 { font-size: 20px; }
.timer { height: 6px; background: var(--bg2); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
.timer > i { display: block; height: 100%; background: var(--teal); width: 100%; transition: width .2s linear; }
.timer.low > i { background: var(--danger); }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-height: 360px; }
.side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 72px; }
.side .panel { padding: 12px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tabs button { flex: 1; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.tabs button.on { color: var(--text); border-color: #3d4759; }
.logbox { height: 300px; overflow: auto; font-size: 13px; line-height: 1.55; display: flex; flex-direction: column; gap: 3px; }
.logbox .l { color: #c4cad4; }
.logbox .c b { color: var(--teal); }
.chatrow { display: flex; gap: 6px; margin-top: 8px; }
.chatrow input { flex: 1; min-width: 0; padding: 8px 10px; }

.statusline { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; }
.statusline.me { border-color: var(--accent); color: var(--accent); }
.scorebar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.sb { display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.sb.turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.sb.me .n { text-decoration: underline; text-underline-offset: 3px; }
.sb.dead { opacity: .4; }
.sb .v { font-family: var(--mono); font-weight: 700; }
.pc { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.cards { display: flex; gap: 8px; flex-wrap: wrap; }
.ncard { width: 54px; height: 76px; border-radius: 10px; background: #f4efe4; color: #1b1b1b; display: grid; place-items: center; font-size: 26px; font-weight: 800; border: 2px solid transparent; cursor: pointer; user-select: none; position: relative; box-shadow: 0 2px 0 rgba(0,0,0,.35); transition: transform .08s; }
.ncard:hover { transform: translateY(-3px); }
.ncard.sel { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 6px 16px rgba(242,179,61,.3); }
.ncard.dim { opacity: .3; cursor: default; transform: none; }
.ncard.back { background: repeating-linear-gradient(45deg, #2b3444, #2b3444 6px, #232b38 6px, #232b38 12px); color: transparent; cursor: default; }
.ncard.small { width: 38px; height: 54px; font-size: 18px; border-radius: 8px; }
.ncard .s { position: absolute; top: 3px; left: 5px; font-size: 11px; }
.c-R { color: #d93b3b; } .c-B { color: #2f6fd6; } .c-G { color: #1f9a55; } .c-Y { color: #c08b00; }

.grid-board { display: grid; gap: 0; user-select: none; touch-action: manipulation; margin: 0 auto; }
.result-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.result-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; }
.result-item .rk { font-family: var(--mono); font-size: 22px; font-weight: 800; width: 34px; text-align: center; color: var(--muted); }
.result-item.first .rk { color: var(--accent); }
.result-item.last { border-color: #5a2b2b; }
.delta.up { color: var(--ok); } .delta.down { color: var(--danger); }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
.table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.table td.num { font-family: var(--mono); }

#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 440px; }
.toast { background: #2a3140; border: 1px solid #3d4759; padding: 10px 16px; border-radius: 10px; font-weight: 600; animation: fade .2s; text-align: center; }
.toast.err { background: #3a1f22; border-color: #6b2f33; }

.queuebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 40; background: var(--surface2); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #3d4759; border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.mobile-tabs { display: none; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; padding-top: 22px; }
  .lobby { grid-template-columns: 1fr; }
  .play { grid-template-columns: 1fr; }
  .side { position: static; }
  .logbox { height: 180px; }
  .nav { display: none; }
  .mobile-tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: rgba(13,16,21,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .mobile-tabs button { flex: 1; background: none; border: 0; padding: 12px 0; color: var(--muted); font-weight: 700; font-size: 13px; }
  .mobile-tabs button.on { color: var(--accent); }
  body.has-mtabs { padding-bottom: 60px; }
  .code { font-size: 30px; }
  .stage { padding: 12px; }
  .ncard { width: 46px; height: 66px; font-size: 22px; }
  .queuebar { bottom: 74px; }
}

/* 커스터마이징 */
:root { --cardback: repeating-linear-gradient(45deg,#2b3444,#2b3444 5px,#222a37 5px,#222a37 10px); }
.ncard.back { background: var(--cardback) !important; }
.title-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border: 1px solid; border-radius: 999px; white-space: nowrap; vertical-align: middle; }
.chip-pts { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; margin-right: 6px; }
.chip-pts b { font-family: var(--mono); color: var(--teal); }
.chip-pts.big { font-size: 16px; padding: 8px 14px; cursor: default; }
.shopgrid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.shopitem { min-height: 0; align-items: stretch; }
.shopitem .prev { height: 70px; display: grid; place-items: center; }
.shopitem.equipped { box-shadow: 0 0 0 1px var(--accent) inset; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.statgrid > div { display: flex; flex-direction: column; gap: 4px; }
.statgrid b { font-size: 20px; font-family: var(--mono); }
.emotebar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 10px; }
.emotebar .emo { font-size: 20px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: transform .08s; }
.emotebar .emo:active { transform: scale(.9); }
#emote-layer { position: fixed; left: 0; right: 0; bottom: 90px; height: 0; z-index: 80; pointer-events: none; }
.emote-bubble { position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; animation: emoteUp 2.6s ease-out forwards; }
.emote-bubble .e { font-size: 46px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
.emote-bubble .who { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; background: rgba(13,16,21,.85); padding: 2px 8px 2px 2px; border-radius: 999px; }
@keyframes emoteUp { 0% { transform: translateY(20px) scale(.6); opacity: 0; } 15% { transform: translateY(0) scale(1.1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-160px) scale(1); opacity: 0; } }
.sb .avatar { margin-left: -2px; }
@media (max-width: 860px) { .chip-user .uname { display: none; } }

</style>

<script>
'use strict';
/* MIND ARENA 프론트엔드 셸: 로그인, 홈, 대기실, 플레이 */
(function () {
  const $app = document.getElementById('app');
  const S = {
    token: null, user: null, config: null, catalog: null,
    ws: null, wsReady: false, offset: 0,
    room: null, view: null, queue: null,
    route: '', filterSeason: 0, filterKind: '', sideTab: 'log',
    local: {}, localKey: '', pendingJoin: null, lastRoomStatus: null,
  };
  window.MA = S;

  // ---------------- 유틸
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KIND = { main: '메인 매치', prison: '감옥 매치', prize: '상금 매치', hidden: '히든 스테이지', final: '결승', exile: '유배지 매치' };
  const PCOL = ['#f2b33d', '#4fd1c5', '#ef6b6b', '#8f9bff', '#7ad36b', '#e58ad6', '#f08a4b', '#cfd6e2'];
  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* 무시 */ } }
  async function api(path, body, method) {
    const opt = { method: method || (body ? 'POST' : 'GET'), headers: {} };
    if (body) { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
    if (S.token) opt.headers.Authorization = 'Bearer ' + S.token;
    const r = await fetch(path, opt);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '요청 실패');
    return j;
  }
  function avatar(u, size) {
    const COS = window.MA_COS;
    const icon = u && u.cos ? u.cos.icon : (u && S.user && u.id === S.user.id ? COS.profile.equip.icon : null);
    if (u && u.picture && (!icon || icon === 'i_letter')) return '<span class="avatar"><img src="' + esc(u.picture) + '" alt="" referrerpolicy="no-referrer"></span>';
    return COS.iconHtml(u && u.name, icon, size);
  }
  function roomPlayer(id) { return S.room && S.room.players.find((x) => x.id === id); }
  const now = () => Date.now() + S.offset;
  function gameMeta(id) { return S.catalog && S.catalog.games.find((g) => g.id === id); }

  // 게임 UI에서 쓰는 공용 도구
  const Kit = {
    esc, toast,
    pname(id) { const p = S.room && S.room.players.find((x) => x.id === id); return p ? p.name : '?'; },
    pcolor(id) { const i = S.room ? S.room.players.findIndex((x) => x.id === id) : 0; return PCOL[(i < 0 ? 0 : i) % PCOL.length]; },
    me() { return S.user && S.user.id; },
    send(a) { wsSend({ t: 'act', a }); },
    local() { return S.local; },
    now,
    rerender() { renderPlayStage(); },
    scorebar(entries) {
      // entries: [{id, v, turn, dead, extra}]
      return '<div class="scorebar">' + entries.map((e) => '<div class="sb' + (e.turn ? ' turn' : '') + (e.dead ? ' dead' : '') + (e.id === Kit.me() ? ' me' : '') + '"><span class="pc" style="background:' + Kit.pcolor(e.id) + '"></span>' + Kit.icon(e.id, 18) + '<span class="n">' + esc(Kit.pname(e.id)) + '</span>' + (e.v != null ? '<span class="v">' + esc(e.v) + '</span>' : '') + (e.extra ? '<span class="muted small">' + e.extra + '</span>' : '') + '</div>').join('') + '</div>';
    },
    icon(id, size) { const p = roomPlayer(id); return p ? avatar(p, size || 18) : ''; },
    piece(id) { const p = roomPlayer(id); return (p && p.cos && p.cos.piece) || 'pc_circle'; },
    pieceSvg(...a) { return window.MA_COS.pieceSvg(...a); },
    status(text, mine) { return '<div class="statusline' + (mine ? ' me' : '') + '">' + text + '</div>'; },
  };
  window.Kit = Kit;
  window.GameUI = window.GameUI || {};

  // ---------------- 서버 없는 모드: 방장 브라우저가 게임을 진행하고 친구는 P2P(WebRTC)로 접속
  const Local = (function () {
    const PREFIX = 'mindarena-v1-';
    const PEER_SRC = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    let room = null; let me = null; let botTimer = null;
    let peer = null; let conns = {}; let guest = null;
    const BOT = ['알파', '베타', '감마', '델타', '엡실론', '제타', '에타', '세타'];
    const E = () => window.MA_ENGINE;
    const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
    const cleanName = (s) => String(s || '').replace(/[<>\u0000-\u001f]/g, '').trim().slice(0, 12);

    function myId() {
      // 탭마다 다른 id (같은 PC에서 창 두 개로 테스트해도 겹치지 않게). 새로고침해도 유지됨
      let id = null;
      try { id = sessionStorage.getItem('ma_uid'); } catch (e) { /* 무시 */ }
      if (!id) { id = 'p' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('ma_uid', id); } catch (e) { /* 무시 */ } }
      return id;
    }
    function user(name) {
      lsSet('ma_offname', name);
      me = { id: myId(), name, provider: 'local', picture: '', rating: 1200, played: 0, wins: 0, games: {} };
      if (room) { const p = room.players.find((x) => x.id === me.id); if (p) { p.name = name; emitRoom(); } }
      return me;
    }

    // ---- 방장 쪽
    function online(pid) { return pid === me.id || !!(conns[pid] && conns[pid].open); }
    function sendTo(pid, msg) {
      if (pid === me.id) { onMsg(msg); return; }
      const c = conns[pid];
      if (c && c.open) { try { c.send(msg); } catch (e) { /* 무시 */ } }
    }
    function emitRoom() {
      if (!room) return;
      const sum = {
        code: room.code, gameId: room.gameId, status: room.status, ranked: false, hostId: room.hostId, p2p: room.p2p, startedAt: room.startedAt, opts: room.opts || {},
        players: room.players.map((p) => ({ id: p.id, name: p.name, bot: !!p.bot, left: !!p.left, online: p.bot ? true : online(p.id), cos: p.cos || {} })),
        emotes: (room.emotes || []).filter((x) => Date.now() - x.at < 6000),
        results: room.results, ratingChange: null,
        log: room.state ? room.state.log.slice(-30) : [], chat: room.chat.slice(-40),
      };
      room.players.forEach((p) => {
        if (p.bot) return;
        let view = null;
        if (room.state) { try { view = room.game.view(room.state, p.id); } catch (e) { console.error(e); } }
        sendTo(p.id, { t: 'room', room: sum, view, now: Date.now() });
      });
    }
    function loadPeer() {
      return new Promise((res, rej) => {
        if (window.Peer) return res();
        const old = document.getElementById('peerjs');
        if (old) { old.addEventListener('load', () => res()); old.addEventListener('error', () => rej(new Error('load'))); return; }
        const s = document.createElement('script');
        s.id = 'peerjs'; s.src = PEER_SRC; s.onload = () => res(); s.onerror = () => rej(new Error('load'));
        document.head.appendChild(s);
      });
    }
    function closePeer() {
      Object.values(conns).forEach((c) => { try { c.close(); } catch (e) { /* 무시 */ } });
      conns = {};
      if (peer) { try { peer.destroy(); } catch (e) { /* 무시 */ } peer = null; }
    }
    async function openHost(r, tries) {
      try { await loadPeer(); } catch (e) { r.p2p = 'fail'; emitRoom(); toast('인터넷 연결이 없어 봇 대전만 할 수 있어요', true); return; }
      if (room !== r) return;
      const p = new window.Peer(PREFIX + r.code);
      p.on('open', () => { if (room !== r) { p.destroy(); return; } peer = p; r.p2p = 'ok'; emitRoom(); });
      p.on('connection', (c) => hostConn(c));
      p.on('error', (e) => {
        if (room !== r) return;
        if (e.type === 'unavailable-id' && (tries || 0) < 4) { p.destroy(); r.code = newCode(); openHost(r, (tries || 0) + 1); return; }
        if (!peer || peer === p) { r.p2p = 'fail'; emitRoom(); toast('친구 초대 연결을 만들지 못했어요. 봇 대전은 계속할 수 있어요', true); }
      });
      p.on('disconnected', () => { try { p.reconnect(); } catch (e) { /* 무시 */ } });
    }
    function hostConn(c) {
      c.on('data', (d) => {
        if (!d || typeof d !== 'object') return;
        c.seen = Date.now();
        if (d.t === 'pong') return;
        if (d.t === 'hello') {
          const pid = String(d.id || '').slice(0, 24);
          const name = cleanName(d.name) || '손님';
          const cos = window.MA_COS.sanitize(d.cos);
          if (!pid || !room) { c.send({ t: 'error', msg: '방이 없습니다', fatal: true }); return; }
          const ex = room.players.find((x) => x.id === pid);
          if (ex) { // 다시 접속
            if (conns[pid] && conns[pid] !== c) { try { conns[pid].close(); } catch (e) { /* 무시 */ } }
            conns[pid] = c; c.pid = pid; ex.name = name; ex.cos = cos;
            if (ex.left) { ex.left = false; ex.bot = false; if (room.state) room.state.log.push(name + ' 님이 다시 들어왔습니다'); }
            emitRoom(); schedule(); return;
          }
          if (room.status !== 'lobby') { c.send({ t: 'error', msg: '이미 게임이 진행 중입니다', fatal: true }); return; }
          if (room.players.length >= room.game.max) { c.send({ t: 'error', msg: '방이 가득 찼습니다', fatal: true }); return; }
          room.players.push({ id: pid, name, cos });
          conns[pid] = c; c.pid = pid;
          emitRoom();
          return;
        }
        if (c.pid) handle(d, c.pid);
      });
      c.on('close', () => drop(c.pid, c));
      c.on('error', () => drop(c.pid, c));
    }
    function drop(pid, c) {
      if (!pid || conns[pid] !== c) return;
      delete conns[pid];
      if (!room) return;
      const p = room.players.find((x) => x.id === pid);
      if (!p) return;
      if (room.status === 'playing') {
        p.left = true; p.bot = true;
        if (room.game.disconnect) room.game.disconnect(room.state, pid);
        room.state.log.push(p.name + ' 님의 연결이 끊겨 자동 진행합니다');
      } else room.players = room.players.filter((x) => x.id !== pid);
      emitRoom(); schedule();
    }

    function start() {
      const g = room.game;
      if (room.players.length < g.min) throw new Error('최소 ' + g.min + '명이 필요합니다. 친구를 초대하거나 봇을 추가하세요');
      room.status = 'playing'; room.results = null; room.startedAt = Date.now();
      room.state = g.setup(room.players.map((p) => ({ id: p.id, name: p.name, bot: !!p.bot })), room.opts || {});
      emitRoom(); schedule();
    }
    function finish() {
      room.status = 'ended';
      clearTimeout(botTimer);
      room.results = room.game.result(room.state).map((r) => Object.assign(r, { name: (room.players.find((p) => p.id === r.id) || {}).name }));
    }
    function pump() {
      if (!room || room.status !== 'playing') return false;
      const g = room.game; const st = room.state;
      let changed = false;
      for (let i = 0; i < 100 && !g.over(st); i++) {
        const t = Date.now();
        if (g.tick) { if (g.tick(st, t)) changed = true; break; }
        if (st.deadline && t > st.deadline) {
          const pend = g.pending(st);
          if (!pend.length) break;
          pend.forEach((pid) => {
            try { const a = g.bot(st, pid); if (a) { g.act(st, pid, a); st.log.push('⏱ ' + ((room.players.find((p) => p.id === pid) || {}).name || '?') + ' 시간 초과, 자동 진행'); } } catch (e) { console.error(e); }
          });
          changed = true;
          if (st.deadline && Date.now() > st.deadline && g.pending(st).join() === pend.join()) { st.deadline = Date.now() + 5000; break; }
          continue;
        }
        break;
      }
      if (g.over(st)) { finish(); return true; }
      return changed;
    }
    function schedule() {
      clearTimeout(botTimer);
      if (!room || room.status !== 'playing') return;
      const g = room.game;
      const pend = g.pending(room.state);
      const bots = room.players.filter((p) => p.bot && pend.includes(p.id));
      if (!bots.length) return;
      const r = room;
      botTimer = setTimeout(() => {
        if (room !== r || r.status !== 'playing') return;
        const st = r.state;
        bots.forEach((b) => {
          if (!g.pending(st).includes(b.id) || g.over(st)) return;
          try { const a = g.bot(st, b.id); if (a) g.act(st, b.id, a); } catch (e) { console.error(e); }
        });
        pump();
        if (g.over(st) && r.status === 'playing') finish();
        emitRoom(); schedule();
      }, 500 + Math.floor(Math.random() * 700));
    }
    setInterval(() => { if (room && room.status === 'playing' && pump()) { emitRoom(); schedule(); } }, 100);
    // 5초마다 신호를 주고받아, 창을 닫거나 인터넷이 끊긴 사람을 20초 안에 정리
    setInterval(() => {
      const t = Date.now();
      Object.keys(conns).forEach((pid) => {
        const c = conns[pid];
        if (c.seen && t - c.seen > 20000) { try { c.close(); } catch (e) { /* 무시 */ } drop(pid, c); return; }
        try { if (c.open) c.send({ t: 'ping' }); } catch (e) { /* 무시 */ }
      });
      if (guest && guest.conn && guest.conn.open) {
        if (guest.seen && t - guest.seen > 20000) { const g = guest; leaveGuest(true); onMsg({ t: 'left', reason: '방장과 연결이 끊어졌어요' }); void g; }
      }
    }, 5000);

    function closeRoom(reason) {
      clearTimeout(botTimer);
      Object.keys(conns).forEach((pid) => sendTo(pid, { t: 'left', reason }));
      setTimeout(closePeer, 300);
      room = null;
    }

    // ---- 참가자 쪽
    function leaveGuest(silent) {
      const g = guest; guest = null;
      if (!g) return;
      try { if (!silent && g.conn.open) g.conn.send({ t: 'leave' }); } catch (e) { /* 무시 */ }
      setTimeout(() => { try { g.peer.destroy(); } catch (e) { /* 무시 */ } }, 200);
    }
    async function join(code) {
      code = String(code || '').toUpperCase().trim();
      if (!/^[A-Z0-9]{5}$/.test(code)) throw new Error('5자리 방 코드를 확인하세요');
      if (room) closeRoom('방장이 방을 나갔습니다');
      leaveGuest();
      toast('방에 연결하는 중…');
      try { await loadPeer(); } catch (e) { throw new Error('인터넷에 연결되어 있어야 친구 방에 들어갈 수 있어요'); }
      const p = new window.Peer();
      const g = { peer: p, conn: null, code };
      guest = g;
      const fail = (msg) => { if (guest !== g) return; toast(msg, true); leaveGuest(true); onMsg({ t: 'left' }); };
      const timer = setTimeout(() => { if (!g.conn || !g.conn.open) fail('방에 연결하지 못했어요. 코드를 확인하거나 방장에게 다시 링크를 받아 주세요'); }, 15000);
      p.on('error', (e) => { clearTimeout(timer); fail(e.type === 'peer-unavailable' ? '방을 찾을 수 없어요. 방장이 방을 열어 두었는지 확인하세요' : '연결 오류가 났어요 (' + e.type + ')'); });
      p.on('open', () => {
        if (guest !== g) { p.destroy(); return; }
        const c = p.connect(PREFIX + code, { reliable: true });
        g.conn = c;
        c.on('open', () => { clearTimeout(timer); g.seen = Date.now(); c.send({ t: 'hello', id: me.id, name: me.name, cos: window.MA_COS.publicCos() }); });
        c.on('data', (d) => {
          if (guest !== g || !d || typeof d !== 'object') return;
          g.seen = Date.now();
          if (d.t === 'ping') { try { c.send({ t: 'pong' }); } catch (e) { /* 무시 */ } return; }
          if (d.t === 'error' && d.fatal) { onMsg({ t: 'error', msg: d.msg }); leaveGuest(true); onMsg({ t: 'left' }); return; }
          if (d.t === 'left') { leaveGuest(true); onMsg(d); return; }
          onMsg(d);
        });
        c.on('close', () => { if (guest === g) { guest = null; try { p.destroy(); } catch (e) { /* 무시 */ } onMsg({ t: 'left', reason: '방과 연결이 끊어졌어요' }); } });
      });
    }

    function hello() { setTimeout(() => { onMsg({ t: 'welcome', user: me, now: Date.now() }); if (room) emitRoom(); }, 0); }

    // uid: 행동한 사람 (방장은 me.id)
    function handle(m, uid) {
      uid = uid || me.id;
      const fromMe = uid === me.id;
      try {
        const t = m.t;
        if (fromMe && guest && t !== 'create' && t !== 'join') {
          if (t === 'leave') { leaveGuest(); onMsg({ t: 'left' }); return; }
          if (guest.conn && guest.conn.open) guest.conn.send(m); else toast('방에 연결 중입니다…', true);
          return;
        }
        if (t === 'create' && fromMe) {
          const g = E().byId[m.game];
          if (!g) throw new Error('없는 게임입니다');
          leaveGuest();
          if (room) closeRoom('방장이 방을 나갔습니다');
          room = { code: newCode(), hostId: me.id, gameId: g.id, game: g, players: [{ id: me.id, name: me.name, cos: window.MA_COS.publicCos() }], emotes: [], status: 'lobby', state: null, results: null, chat: [], p2p: g.solo ? 'off' : 'wait', opts: Object.fromEntries((g.options || []).map((x) => [x.key, x.def])) };
          if (g.solo) start(); else { emitRoom(); openHost(room, 0); }
          return;
        }
        if (t === 'join' && fromMe) { join(m.code).catch((e) => onMsg({ t: 'error', msg: e.message })); return; }
        if (!room) throw new Error('방에 있지 않습니다');
        const isHost = uid === room.hostId;
        const player = room.players.find((p) => p.id === uid);
        if (t === 'leave') {
          if (isHost) { closeRoom('방장이 방을 나갔습니다'); onMsg({ t: 'left' }); }
          else { const c = conns[uid]; sendTo(uid, { t: 'left' }); if (c) drop(uid, c); }
          return;
        }
        if (t === 'cos') {
          if (player) { player.cos = window.MA_COS.sanitize(m.cos); emitRoom(); }
          return;
        }
        if (t === 'emote') {
          if (!player || !window.MA_COS.ALL_EMOTES.includes(m.e)) return;
          const nowT = Date.now();
          if (player.lastEmote && nowT - player.lastEmote < 1200) return;
          player.lastEmote = nowT;
          room.emotes = (room.emotes || []).filter((x) => nowT - x.at < 6000).concat([{ id: uid, e: m.e, at: nowT }]).slice(-12);
          emitRoom();
          return;
        }
        if (t === 'chat') {
          const text = String(m.text || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 200);
          if (text && player) { room.chat.push({ id: uid, name: player.name, text, at: Date.now() }); emitRoom(); }
          return;
        }
        if (t === 'act') {
          if (room.status !== 'playing') throw new Error('게임 중이 아닙니다');
          if (!player || player.bot) throw new Error('참가자가 아닙니다');
          room.game.act(room.state, uid, m.a || {});
          pump();
          if (room.status === 'playing' && room.game.over(room.state)) finish();
          emitRoom(); schedule();
          return;
        }
        if (!isHost) throw new Error('방장만 할 수 있어요');
        if (t === 'addBot') {
          if (room.status !== 'lobby') return;
          if (room.players.length >= room.game.max) throw new Error('방이 가득 찼습니다');
          const used = new Set(room.players.map((p) => p.name));
          const name = '🤖' + (BOT.find((n) => !used.has('🤖' + n)) || '봇');
          const pickOf = (cat) => { const l = window.MA_COS.ITEMS.filter((x) => x.cat === cat && x.price <= 500); return l[Math.floor(Math.random() * l.length)].id; };
          room.players.push({ id: 'bot_' + Math.random().toString(36).slice(2, 8), name, bot: true, cos: { title: pickOf('title'), icon: pickOf('icon'), piece: pickOf('piece'), victory: 'v_none' } });
          emitRoom(); return;
        }
        if (t === 'kick') {
          if (room.status !== 'lobby' || m.id === uid) return;
          const target = room.players.find((p) => p.id === m.id);
          if (!target) return;
          room.players = room.players.filter((p) => p.id !== m.id);
          if (!target.bot) { sendTo(m.id, { t: 'left', reason: '방장이 내보냈습니다' }); const c = conns[m.id]; delete conns[m.id]; setTimeout(() => { try { c && c.close(); } catch (e) { /* 무시 */ } }, 300); }
          emitRoom(); return;
        }
        if (t === 'opt') {
          const o = (room.game.options || []).find((x) => x.key === m.key);
          if (!o || room.status !== 'lobby' || !o.choices.some((c) => c[0] === m.value)) return;
          room.opts = Object.assign({}, room.opts, { [o.key]: m.value });
          emitRoom(); return;
        }
        if (t === 'start') { if (room.status === 'lobby') start(); return; }
        if (t === 'again') {
          if (room.status !== 'ended') return;
          room.players = room.players.filter((p) => !p.left);
          room.status = 'lobby'; room.state = null; room.results = null;
          if (room.game.solo) start(); else emitRoom();
        }
      } catch (e) { sendTo(uid, { t: 'error', msg: e.message || '오류' }); }
    }
    window.addEventListener('beforeunload', () => { if (room) closeRoom('방장이 방을 나갔습니다'); leaveGuest(); });
    return { user, hello, handle: (m) => handle(m, me && me.id), reset() { if (room) closeRoom('방장이 방을 나갔습니다'); leaveGuest(); } };
  })();

  // ---------------- 웹소켓
  let wsRetry = 0;
  function connect() {
    if (!S.token) return;
    if (S.offline) { Local.hello(); return; }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws');
    S.ws = ws;
    ws.onopen = () => { ws.send(JSON.stringify({ t: 'hello', token: S.token })); };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      onMsg(m);
    };
    ws.onclose = () => {
      S.wsReady = false;
      if (S.ws !== ws || !S.token) return;
      const d = Math.min(8000, 500 * 2 ** wsRetry++);
      setTimeout(connect, d);
    };
  }
  function wsSend(o) {
    if (S.offline) { Local.handle(o); return; }
    if (S.ws && S.wsReady) S.ws.send(JSON.stringify(o));
    else toast('서버에 연결 중입니다…', true);
  }
  window.wsSend = wsSend;

  // ---------------- 포인트·이모티콘
  const seenEmotes = new Set();
  function showEmotes(room) {
    (room.emotes || []).forEach((x) => {
      const k = x.id + ':' + x.at;
      if (seenEmotes.has(k)) return;
      seenEmotes.add(k);
      if (Date.now() + S.offset - x.at > 5000) return;
      const p = room.players.find((q) => q.id === x.id);
      const layer = document.getElementById('emote-layer') || (() => { const d = document.createElement('div'); d.id = 'emote-layer'; document.body.appendChild(d); return d; })();
      const b = document.createElement('div');
      b.className = 'emote-bubble';
      b.style.left = (12 + Math.random() * 60) + '%';
      b.innerHTML = '<span class="e">' + esc(x.e) + '</span><span class="who">' + (p ? avatar(p, 18) + esc(p.name) : '') + '</span>';
      layer.appendChild(b);
      setTimeout(() => b.remove(), 2600);
    });
    if (seenEmotes.size > 300) seenEmotes.clear();
  }
  function giveReward(room) {
    const res = room.results || [];
    const mine = res.find((x) => x.id === S.user.id);
    if (!mine) return;
    const humans = room.players.filter((p) => !p.bot || p.left).length;
    const meta = gameMeta(room.gameId);
    let pts;
    if (meta && meta.solo) pts = 20 * (Number(String(mine.note).match(/\d+/)) || 0);
    else pts = window.MA_COS.reward(mine.rank, res.length, humans);
    const got = window.MA_COS.award(room.code + ':' + (room.startedAt || '') + ':' + res.map((x) => x.rank).join(''), pts, mine.rank === 1 && res.length > 1);
    S.lastAward = { code: room.code, pts: got, rank: mine.rank };
    if (got) setTimeout(() => toast('💎 ' + got + ' 포인트를 받았어요!'), 400);
  }
  function sendCos() { if (S.room) wsSend({ t: 'cos', cos: window.MA_COS.publicCos() }); }

  function onMsg(m) {
    if (m.now) S.offset = m.now - Date.now();
    if (m.t === 'auth' && !m.ok) { logout(); return; }
    if (m.t === 'welcome') {
      S.wsReady = true; wsRetry = 0; S.user = m.user;
      if (!S.offline && S.ws) S.ws.send(JSON.stringify({ t: 'cos', cos: window.MA_COS.publicCos() }));
      if (S.pendingJoin) { wsSend({ t: 'join', code: S.pendingJoin }); S.pendingJoin = null; }
      render();
      return;
    }
    if (m.t === 'error') { toast(m.msg, true); return; }
    if (m.t === 'room') {
      const prev = S.room;
      if (prev && prev.code === m.room.code && prev.status === 'playing' && m.room.status === 'ended') giveReward(m.room);
      showEmotes(m.room);
      if (m.room.status !== 'ended') { const rm = document.getElementById('resultmodal'); if (rm) rm.remove(); }
      S.room = m.room; S.view = m.view;
      const key = m.room.code + ':' + (m.room.status === 'lobby' ? 'L' : 'G');
      if (S.localKey !== key && m.room.status !== 'ended') { S.local = {}; S.localKey = key; }
      if (!prev || prev.code !== m.room.code || prev.status !== m.room.status) { S.queue = null; go('#/room', true); render(); }
      else if (S.route === 'room') updateRoom();
      return;
    }
    if (m.t === 'left') {
      S.room = null; S.view = null;
      { const rm = document.getElementById('resultmodal'); if (rm) rm.remove(); }
      if (m.reason) toast(m.reason, true);
      if (S.route === 'room') go('#/');
      return;
    }
  }

  // ---------------- 라우팅
  function go(hash, silent) {
    if (location.hash !== hash) { if (silent) history.replaceState(null, '', hash); else location.hash = hash; }
    if (silent) S.route = parseRoute();
  }
  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, '');
    if (h.startsWith('join/')) return 'join';
    return h.split('/')[0] || 'home';
  }
  window.addEventListener('hashchange', () => render());

  // ---------------- 화면
  function render() {
    const h = location.hash.replace(/^#\/?/, '');
    if (h.startsWith('join/')) {
      const code = h.slice(5).toUpperCase();
      if (S.token) { if (S.wsReady) wsSend({ t: 'join', code }); else S.pendingJoin = code; history.replaceState(null, '', '#/'); }
      else { S.pendingJoin = code; lsSet('ma_join', code); }
    }
    S.route = parseRoute();
    if (!S.token) return renderLogin();
    if (!S.user || !S.catalog) { $app.innerHTML = '<div class="login"><div class="spin"></div></div>'; return; }
    if (S.room && S.route !== 'room' && S.route !== 'me' && S.route !== 'shop') { go('#/room', true); }
    document.body.classList.toggle('has-mtabs', S.route !== 'room');
    if (S.route === 'room' && S.room) return renderRoom();
    if (S.route === 'me') return renderMe();
    if (S.route === 'shop') return renderShop();
    return renderHome();
  }

  function topbar(active) {
    return '<div class="topbar"><div class="wrap">' +
      '<div class="logo" data-go="#/">' + logoSvg(26) + '<span>MIND <b>ARENA</b></span></div>' +
      '<div class="nav">' +
      '<button data-go="#/" class="' + (active === 'home' ? 'on' : '') + '">게임</button>' +
      '<button data-go="#/shop" class="' + (active === 'shop' ? 'on' : '') + '">상점</button>' +
      (S.room ? '<button data-go="#/room">내 방 ' + esc(S.room.code) + '</button>' : '') +

  // 로그인
  function renderLogin() {
    const cfg = S.config || {};
    $app.innerHTML = '<div class="login"><div class="box">' +
      '<div style="display:flex;justify-content:center;margin-bottom:14px">' + logoSvg(64) + '</div>' +
      '<h1>MIND <b>ARENA</b></h1>' +
      (S.offline ? '<p class="sub">두뇌 서바이벌 예능 속 게임을<br>방 코드로 친구를 불러 함께 플레이하세요.</p>' :
        '<p class="sub">두뇌 서바이벌 예능 속 게임을<br>방 코드로 친구를 불러 함께 플레이하세요.</p>') +
      (cfg.googleClientId ? '<div class="gbtn" id="gbtn"></div>' : '') +
      (cfg.googleClientId && cfg.allowGuest ? '<div class="divider">또는</div>' : '') +
      (cfg.allowGuest ? '<div class="joinrow"><input id="gname" maxlength="12" placeholder="게스트 닉네임 (2~12자)"><button class="btn primary" id="gok">시작</button></div>' : '') +
      (!cfg.googleClientId && !cfg.allowGuest ? '<p class="muted">로그인 방법이 설정되지 않았습니다. 관리자에게 문의하세요.</p>' : '') +
      '</div></div>';
    const ok = document.getElementById('gok');
    if (ok) {
      const inp = document.getElementById('gname');
      inp.value = lsGet('ma_lastname') || '';
      const doGuest = async () => {
        if (S.offline) {
          const name = inp.value.replace(/[<>]/g, '').trim().slice(0, 12);
          if (name.length < 2) { toast('닉네임은 2~12자로 입력하세요', true); return; }
          lsSet('ma_lastname', name);
          login('local', Local.user(name));
          return;
        }
        try {
          const j = await api('/api/auth/guest', { name: inp.value });
          lsSet('ma_lastname', inp.value);
          login(j.token, j.user);
        } catch (e) { toast(e.message, true); }
      };
      ok.onclick = doGuest;
      inp.onkeydown = (e) => { if (e.key === 'Enter') doGuest(); };
    }
    if (cfg.googleClientId) loadGoogle(cfg.googleClientId);
  }
  function loadGoogle(clientId) {
    const init = () => {
      if (!window.google || !document.getElementById('gbtn')) return;
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: async (resp) => {
          try { const j = await api('/api/auth/google', { credential: resp.credential }); login(j.token, j.user); } catch (e) { toast(e.message, true); }
        },
      });
      window.google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ko', width: 300 });
    };
    if (window.google && window.google.accounts) return init();
    if (document.getElementById('gsi')) return;
    const s = document.createElement('script');
    s.id = 'gsi'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = init;
    document.head.appendChild(s);
  }
  function login(token, user) {
    S.token = token; S.user = user;
    if (!S.offline) lsSet('ma_token', token);
    const j = lsGet('ma_join');
    if (j) { S.pendingJoin = j; lsSet('ma_join', null); }
    connect();
    location.hash = '#/';
    render();
  }
  function logout() {
    S.token = null; S.user = null; S.room = null;
    lsSet('ma_token', null);
    if (S.offline) { Local.reset(); lsSet('ma_offname', null); }
    if (S.ws) { const w = S.ws; S.ws = null; w.close(); }
    if (window.google && window.google.accounts) window.google.accounts.id.disableAutoSelect();
    location.hash = '#/';
    render();
  }

  // 홈

    $app.innerHTML = topbar('home') + '<div class="wrap">' +
      '<div class="hero"><div><h1>오직 승리를 위해,<br><em>머리</em>를 쓰세요.</h1><p>방송에 나온 두뇌 게임을 실시간 멀티플레이로. 방 코드나 초대 링크로 친구를 불러 함께 즐겨 보세요.</p></div>' +
      '<div class="joinbox"><label>친구에게 받은 방 코드</label><div class="joinrow"><input id="jcode" maxlength="5" placeholder="ABCDE" autocomplete="off"><button class="btn primary" id="jgo">입장</button></div></div></div>' +

      '<div style="height:40px"></div></div>';
    bindGo($app);
    $app.querySelectorAll('[data-season]').forEach((b) => { b.onclick = () => { S.filterSeason = Number(b.dataset.season); renderHome(); }; });
    $app.querySelectorAll('[data-kind]').forEach((b) => { b.onclick = () => { S.filterKind = b.dataset.kind; renderHome(); }; });
    $app.querySelectorAll('[data-game]').forEach((c) => { c.onclick = () => openGame(c.dataset.game); });
    const j = document.getElementById('jcode');
    if (!j) { renderQueue(); return; }
    const doJoin = () => { const c = j.value.trim().toUpperCase(); if (c.length === 5) wsSend({ t: 'join', code: c }); else toast('5자리 코드를 입력하세요', true); };
    document.getElementById('jgo').onclick = doJoin;
    j.onkeydown = (e) => { if (e.key === 'Enter') doJoin(); };
    renderQueue();
  }
  function players(g) { return g.min === g.max ? g.min + '인' : g.min + '~' + g.max + '인'; }
  function cardHtml(g) {
    return '<div class="card" data-game="' + g.id + '"><div class="origin">' + esc(g.origin) + '</div><h3>' + esc(g.title) + '</h3><p>' + esc(g.summary) + '</p>' +
      '<div class="meta"><span class="tag ' + g.kind + '">' + KIND[g.kind] + '</span><span class="tag">' + (g.solo ? '혼자 도전' : players(g)) + '</span>' + '</div></div>';
  }
  function openGame(id) {
    const g = gameMeta(id);
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal"><div class="origin muted small">' + esc(g.origin) + '</div><h2>' + esc(g.title) + '</h2>' +
      '<div class="meta row"><span class="tag ' + g.kind + '">' + KIND[g.kind] + '</span><span class="tag">' + (g.solo ? '혼자 도전' : players(g)) + '</span>' + '</div>' +
      '<ol class="rules">' + g.rules.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ol>' +
      '<div class="row">' +
      (g.solo ? '<button class="btn primary lg" data-a="create">도전 시작</button>' : '<button class="btn primary lg" data-a="create">친선전 방 만들기</button>') +
      '<div class="spacer"></div><button class="btn ghost" data-a="close">닫기</button></div>' +
      '</div>';
    document.body.appendChild(bg);
    bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
    bg.querySelector('[data-a="close"]').onclick = () => bg.remove();
    bg.querySelector('[data-a="create"]').onclick = () => { bg.remove(); wsSend({ t: 'create', game: id }); };
  }
  function renderQueue() { const el = document.getElementById('queuebar'); if (el) el.remove(); }


  // 방(대기실/플레이/결과)
  function renderRoom() {
    const r = S.room;
    const g = gameMeta(r.gameId);
    if (r.status === 'lobby') return renderLobby(r, g);
    if (S.sideTabRoom !== r.code + r.status) { S.sideTabRoom = r.code + r.status; S.sideTab = 'log'; }
    $app.innerHTML = topbar('room') +
      '<div class="wrap play"><div>' +
      '<div class="gamehead"><h2>' + esc(g.title) + '</h2><span class="tag ' + g.kind + '">' + KIND[g.kind] + '</span>' + '<span class="tag">방 ' + esc(r.code) + '</span>' +
      '<div class="spacer"></div><button class="btn sm ghost" id="rulesbtn">규칙</button><button class="btn sm danger" id="leavebtn">나가기</button></div>' +
      '<div class="timer" id="timer"><i></i></div>' +
      '<div class="stage" id="stage"></div>' + emoteBar() + '</div>' +
      '<div class="side"><div class="panel"><div class="tabs"><button data-tab="log">진행 기록</button><button data-tab="chat">채팅</button></div><div class="logbox" id="logbox"></div>' +
      '<div class="chatrow"><input id="chatin" maxlength="200" placeholder="메시지 입력"><button class="btn sm" id="chatgo">전송</button></div></div>' +
      '<div class="panel small" id="plist"></div></div></div>';
    bindGo($app);
    document.getElementById('leavebtn').onclick = () => {
      if (r.status === 'playing' && !confirm('게임 중에 나가면 남은 진행은 자동으로 처리됩니다. 나갈까요?')) return;
      wsSend({ t: 'leave' });
    };
    document.getElementById('rulesbtn').onclick = () => showRules(g);
    bindEmotes($app);
    $app.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { S.sideTab = b.dataset.tab; renderSide(); }; });
    const ci = document.getElementById('chatin');
    const sendChat = () => { if (ci.value.trim()) { wsSend({ t: 'chat', text: ci.value }); ci.value = ''; S.sideTab = 'chat'; } };
    document.getElementById('chatgo').onclick = sendChat;
    ci.onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };
    updateRoom();
  }
  function showRules(g) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal"><h2>' + esc(g.title) + '</h2><ol class="rules">' + g.rules.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ol><button class="btn" id="rc">닫기</button></div>';
    document.body.appendChild(bg);
    bg.onclick = (e) => { if (e.target === bg || e.target.id === 'rc') bg.remove(); };
  }
  function updateRoom() {
    const r = S.room;
    if (!r) return;
    if (r.status === 'lobby') { if (document.getElementById('lobby')) return renderLobby(r, gameMeta(r.gameId)); return renderRoom(); }
    if (!document.getElementById('stage')) return renderRoom();
    renderPlayStage();
    renderSide();
    renderPList();
    if (r.status === 'ended') showResult();
    else { const m = document.getElementById('resultmodal'); if (m) m.remove(); }
  }
  function renderPlayStage() {
    const el = document.getElementById('stage');
    if (!el || !S.room) return;
    const ui = window.GameUI[S.room.gameId];
    if (!S.view) { el.innerHTML = '<p class="muted">불러오는 중…</p>'; return; }
    // 다시 그려도 입력 중인 글자와 커서가 사라지지 않게 보존
    const act = document.activeElement;
    const keep = act && el.contains(act) && act.tagName === 'INPUT' && act.id ? { id: act.id, v: act.value, a: act.selectionStart, b: act.selectionEnd } : null;
    try { ui(el, S.view, Kit); } catch (e) { console.error(e); el.innerHTML = '<p class="muted">화면을 그리는 중 오류가 났습니다.</p>'; }
    if (keep) {
      const n = document.getElementById(keep.id);
      if (n && !n.disabled) { n.value = keep.v; n.focus(); try { n.setSelectionRange(keep.a, keep.b); } catch (x) { /* 무시 */ } }
    }
  }
  function renderSide() {
    const box = document.getElementById('logbox');
    if (!box) return;
    document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.sideTab));
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30;
    if (S.sideTab === 'log') box.innerHTML = S.room.log.map((l) => '<div class="l">' + esc(l) + '</div>').join('') || '<div class="muted">기록 없음</div>';
    else box.innerHTML = S.room.chat.map((c) => '<div class="c"><b>' + esc(c.name) + '</b> ' + esc(c.text) + '</div>').join('') || '<div class="muted">채팅이 없습니다</div>';
    if (atBottom || !box.dataset.init) { box.scrollTop = box.scrollHeight; box.dataset.init = 1; }
  }
  function emoteBar() {
    return '<div class="emotebar">' + window.MA_COS.myEmotes().map((e) => '<button class="emo" data-emo="' + esc(e) + '">' + e + '</button>').join('') + '<a class="muted small" href="#/shop" style="margin-left:6px">+ 더 얻기</a></div>';
  }
  function bindEmotes(root) {
    root.querySelectorAll('[data-emo]').forEach((b) => { b.onclick = () => wsSend({ t: 'emote', e: b.dataset.emo }); });
  }
  function renderPList() {
    const el = document.getElementById('plist');
    if (!el) return;
    el.innerHTML = '<div class="muted small" style="margin-bottom:6px">참가자</div>' + S.room.players.map((p, i) => '<div class="row" style="margin:5px 0;gap:6px"><span class="pc" style="background:' + PCOL[i % PCOL.length] + '"></span>' + avatar(p, 22) + '<span>' + esc(p.name) + '</span>' + window.MA_COS.titleHtml(p.cos && p.cos.title, true) + (p.left ? '<span class="tag">나감</span>' : p.bot ? '' : (p.online ? '' : '<span class="tag">연결 끊김</span>')) + '</div>').join('');
  }
  function showResult() {
    if (document.getElementById('resultmodal')) return;
    const r = S.room;
    const res = r.results || [];
    const maxRank = Math.max(...res.map((x) => x.rank));
    const mine = res.find((x) => x.id === S.user.id);
    const allTie = res.length > 1 && res.every((x) => x.rank === res[0].rank);
    const bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'resultmodal';
    bg.innerHTML = '<div class="modal"><div class="muted small">게임 종료</div><h2>' + (allTie ? '무승부' : mine ? (mine.rank === 1 ? '🏆 승리!' : mine.rank === maxRank && res.length > 1 ? '탈락…' : mine.rank + '위') : '결과') + '</h2>' +
      '<div class="result-list">' + res.map((x) => {
        return '<div class="result-item' + (x.rank === 1 ? ' first' : '') + (x.rank === maxRank && res.length > 1 && !allTie ? ' last' : '') + '"><span class="rk">' + x.rank + '</span>' + Kit.icon(x.id, 34) + '<div style="flex:1"><b>' + esc(x.name) + '</b> ' + window.MA_COS.titleHtml((roomPlayer(x.id) || {}).cos && roomPlayer(x.id).cos.title, true) + '<div class="muted small">' + esc(x.note || '') + '</div></div>' + (x.id === S.user.id && S.lastAward && S.lastAward.code === r.code && S.lastAward.pts ? '<span class="delta up">💎 +' + S.lastAward.pts + '</span>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="row">' + (r.hostId === S.user.id ? '<button class="btn primary" id="again">다시 하기</button>' : '') +
      '<button class="btn" id="viewboard">판 보기</button><div class="spacer"></div><button class="btn danger" id="rleave">나가기</button></div>' +
      (r.hostId !== S.user.id ? '<p class="muted small">방장이 다시 시작하면 같은 방에서 이어서 할 수 있어요.</p>' : '') + '</div>';
    document.body.appendChild(bg);
    // 1등의 승리 연출 (모두에게 보임)
    if (!allTie) {
      const w = res.find((x) => x.rank === 1);
      const wp = w && roomPlayer(w.id);
      if (wp && wp.cos && wp.cos.victory) window.MA_COS.playVictory(wp.cos.victory, '🏆 ' + wp.name + ' 승리!');
    }
    const a = document.getElementById('again'); if (a) a.onclick = () => wsSend({ t: 'again' });
    document.getElementById('viewboard').onclick = () => bg.remove();
    document.getElementById('rleave').onclick = () => { bg.remove(); wsSend({ t: 'leave' }); };
  }

  function renderLobby(r, g) {

    const link = location.origin + location.pathname + '#/join/' + r.code;
    $app.innerHTML = topbar('room') + '<div class="wrap lobby" id="lobby"><div class="panel">' +

        (p.id === r.hostId ? '<span class="tag rk">방장</span>' : '') + (p.bot ? '<span class="tag">봇</span>' : '<span class="dot' + (p.online ? '' : ' off') + '"></span>') +
        (isHost && p.id !== S.user.id ? '<button class="btn sm ghost" data-kick="' + p.id + '">내보내기</button>' : '') + '</div>').join('') + '</div>' +
      (g.options ? '<div class="row" style="margin-top:12px">' + g.options.map((o) => {

        return '<span class="muted small">' + esc(o.label) + '</span>' + o.choices.map((c) => '<button class="btn sm' + (c[0] === cur ? ' on' : '') + '"' + (isHost ? ' data-opt="' + o.key + '" data-val="' + c[0] + '"' : ' disabled') + '>' + esc(c[1]) + '</button>').join('');
      }).join('') + '</div>' : '') +
      '<p class="muted small" style="margin-top:12px">' + r.players.length + ' / ' + g.max + '명 · 최소 ' + g.min + '명</p>' +
      '<div class="row" style="margin-top:12px">' +
      (isHost ? '<button class="btn primary lg" id="start"' + (r.players.length < g.min ? ' disabled' : '') + '>게임 시작</button><button class="btn lg" id="addbot"' + (r.players.length >= g.max ? ' disabled' : '') + '>봇 추가</button>' : '<span class="muted">방장이 시작하기를 기다리는 중…</span>') +
      '<div class="spacer"></div><button class="btn danger" id="lleave">나가기</button></div></div>' +
      '<div class="panel"><h3 style="margin-bottom:6px">규칙</h3><ol class="rules small">' + g.rules.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ol>' +
      '<div class="logbox" id="logbox" style="height:140px"></div><div class="chatrow"><input id="chatin" maxlength="200" placeholder="대기실 채팅"><button class="btn sm" id="chatgo">전송</button></div>' + emoteBar() + '</div></div>';
    bindGo($app);
    bindEmotes($app);
    S.sideTab = 'chat';
    renderSide();
    document.getElementById('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(link); toast('초대 링크를 복사했어요'); } catch (e) { prompt('이 링크를 복사하세요', link); }
    };
    const sh = document.getElementById('share');
    if (sh) sh.onclick = () => navigator.share({ title: 'MIND ARENA ' + g.title, text: '방 코드 ' + r.code, url: link }).catch(() => {});
    const st = document.getElementById('start'); if (st) st.onclick = () => wsSend({ t: 'start' });
    const ab = document.getElementById('addbot'); if (ab) ab.onclick = () => wsSend({ t: 'addBot' });
    document.getElementById('lleave').onclick = () => wsSend({ t: 'leave' });
    $app.querySelectorAll('[data-kick]').forEach((b) => { b.onclick = () => wsSend({ t: 'kick', id: b.dataset.kick }); });
    $app.querySelectorAll('[data-opt]').forEach((b) => { b.onclick = () => wsSend({ t: 'opt', key: b.dataset.opt, value: b.dataset.val }); });
    const ci = document.getElementById('chatin');
    const sendChat = () => { if (ci.value.trim()) { wsSend({ t: 'chat', text: ci.value }); ci.value = ''; } };
    document.getElementById('chatgo').onclick = sendChat;
    ci.onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };
  }

  // 내 정보
  // 상점
  function itemPreview(it) {
    const COS = window.MA_COS;
    if (it.cat === 'title') return '<div class="prev">' + COS.titleHtml(it.id) + '</div>';
    if (it.cat === 'icon') return '<div class="prev">' + COS.iconHtml(S.user.name, it.id, 54) + '</div>';
    if (it.cat === 'emote') return '<div class="prev" style="font-size:26px;letter-spacing:4px">' + it.list.join('') + '</div>';
    if (it.cat === 'victory') return '<div class="prev" style="font-size:30px">' + ({ v_none: '·', v_confetti: '🎊', v_stars: '🌟', v_crown: '👑', v_fireworks: '🎆', v_lightning: '⚡', v_gold: '🪙' }[it.id] || '🎉') + '</div>';
    if (it.cat === 'cardback') return '<div class="prev"><div style="width:44px;height:62px;border-radius:7px;background:' + it.bg + ';box-shadow:0 2px 0 rgba(0,0,0,.4)"></div></div>';
    if (it.cat === 'piece') return '<div class="prev"><svg width="58" height="58" viewBox="0 0 58 58">' + COS.pieceSvg(it.id, 29, 29, 17, '#f2b33d', '#0d1015', 3) + '</svg></div>';
    return '';
  }
  function renderShop() {
    const COS = window.MA_COS;
    const P = COS.profile;
    const cat = S.shopCat || 'title';
    const items = COS.ITEMS.filter((it) => it.cat === cat);
    $app.innerHTML = topbar('shop') + '<div class="wrap" style="padding:22px 16px 70px">' +
      '<div class="row" style="margin-bottom:6px"><h2 style="font-size:26px">상점</h2><div class="spacer"></div><div class="chip-pts big">💎 ' + P.points.toLocaleString() + '</div></div>' +
      '<p class="muted small" style="margin:0 0 14px">게임이 끝나면 순위에 따라 포인트를 받아요. 1등은 더 많이, 사람이 많을수록 조금 더, 봇하고만 하면 절반이에요.</p>' +
      '<div class="filters">' + COS.CATS.map((c) => '<button class="pill' + (c.id === cat ? ' on' : '') + '" data-cat="' + c.id + '">' + c.name + '</button>').join('') + '</div>' +
      '<div class="grid shopgrid">' + items.map((it) => {
        const own = P.owned.includes(it.id);
        const equipped = it.cat !== 'emote' && P.equip[it.cat] === it.id;
        const t = COS.TIER[it.tier];
        let btn;
        if (equipped) btn = '<button class="btn sm" disabled>장착 중</button>';
        else if (own) btn = it.cat === 'emote' ? '<button class="btn sm" disabled>보유 중</button>' : '<button class="btn sm teal" data-equip="' + it.id + '">장착</button>';
        else btn = '<button class="btn sm primary" data-buy="' + it.id + '"' + (P.points < it.price ? ' disabled' : '') + '>💎 ' + it.price.toLocaleString() + '</button>';
        return '<div class="card shopitem' + (equipped ? ' equipped' : '') + '" style="cursor:default;border-color:' + (equipped ? 'var(--accent)' : t.c + '44') + '">' +
          '<div class="row" style="justify-content:space-between"><span class="tag" style="color:' + t.c + '">' + t.n + '</span>' + (own ? '<span class="muted small">보유</span>' : '') + '</div>' +
          itemPreview(it) + '<b style="text-align:center">' + esc(it.name) + '</b>' +
          '<div class="row" style="justify-content:center">' + btn + (it.cat === 'victory' && it.id !== 'v_none' ? '<button class="btn sm ghost" data-preview="' + it.id + '">미리보기</button>' : '') + '</div></div>';
      }).join('') + '</div></div>';
    bindGo($app);
    $app.querySelectorAll('[data-cat]').forEach((b) => { b.onclick = () => { S.shopCat = b.dataset.cat; renderShop(); }; });
    $app.querySelectorAll('[data-buy]').forEach((b) => { b.onclick = () => {
      const it = COS.BY_ID[b.dataset.buy];
      try { COS.buy(it.id); if (it.cat !== 'emote') COS.equip(it.id); toast(it.name + ' 구매 완료!'); sendCos(); renderShop(); } catch (e) { toast(e.message, true); }
    }; });
    $app.querySelectorAll('[data-equip]').forEach((b) => { b.onclick = () => { try { COS.equip(b.dataset.equip); sendCos(); renderShop(); } catch (e) { toast(e.message, true); } }; });
    $app.querySelectorAll('[data-preview]').forEach((b) => { b.onclick = () => COS.playVictory(b.dataset.preview, '미리보기'); });
  }

  // 내 정보
  function renderMe() {
    const u = S.user;
    const COS = window.MA_COS;
    const P = COS.profile;
    const eq = (cat) => { const it = COS.BY_ID[P.equip[cat]]; return it ? esc(it.name) : '-'; };
    const owned = P.owned.length; const total = COS.ITEMS.length;
    $app.innerHTML = topbar('me') + '<div class="wrap" style="padding:24px 16px 70px;max-width:720px"><div class="panel"><div class="row" style="gap:14px">' + avatar(u, 64) + '<div><h2>' + esc(u.name) + '</h2>' + COS.titleHtml(P.equip.title) + '</div></div>' +
      '<div class="joinrow" style="margin-top:16px"><input id="nn" maxlength="12" value="' + esc(u.name) + '"><button class="btn" id="nnok">닉네임 변경</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><div class="statgrid">' +
      '<div><span class="muted small">보유 포인트</span><b>💎 ' + P.points.toLocaleString() + '</b></div><div><span class="muted small">누적 획득</span><b>' + P.stats.earned.toLocaleString() + '</b></div>' +
      '<div><span class="muted small">플레이</span><b>' + P.stats.games + '판</b></div><div><span class="muted small">1등</span><b>' + P.stats.wins + '번</b></div>' +
      '<div><span class="muted small">모은 아이템</span><b>' + owned + ' / ' + total + '</b></div></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3 style="margin-bottom:8px">장착 중</h3><table class="table">' +
      [['칭호', 'title'], ['프로필 아이콘', 'icon'], ['승리 연출', 'victory'], ['카드 뒷면', 'cardback'], ['말 디자인', 'piece']].map(([n, c]) => '<tr><td class="muted">' + n + '</td><td>' + eq(c) + '</td></tr>').join('') +
      '</table><div class="row" style="margin-top:10px"><button class="btn sm" data-go="#/shop">상점에서 바꾸기</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3 style="margin-bottom:6px">기록 옮기기</h3><p class="muted small" style="margin:0 0 10px">포인트와 아이템은 이 브라우저에만 저장돼요. 다른 기기로 옮기거나 백업하려면 코드를 복사해 두세요.</p>' +
      '<div class="row"><button class="btn sm" id="exp">내 기록 코드 복사</button><button class="btn sm" id="imp">코드로 불러오기</button></div></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn danger" id="logout">로그아웃</button></div></div>';
    bindGo($app);
    document.getElementById('nnok').onclick = async () => {
      if (S.offline) {
        const name = document.getElementById('nn').value.replace(/[<>]/g, '').trim().slice(0, 12);
        if (name.length < 2) { toast('닉네임은 2~12자로 입력하세요', true); return; }
        S.user = Local.user(name); toast('닉네임을 바꿨어요'); renderMe(); return;
      }
      try { const j = await api('/api/me', { name: document.getElementById('nn').value }); S.user = j.user; toast('닉네임을 바꿨어요'); renderMe(); } catch (e) { toast(e.message, true); }
    };
    document.getElementById('exp').onclick = async () => {
      const code = COS.exportCode();
      try { await navigator.clipboard.writeText(code); toast('기록 코드를 복사했어요'); } catch (e) { prompt('이 코드를 복사해 두세요', code); }
    };
    document.getElementById('imp').onclick = () => {
      const code = prompt('복사해 둔 기록 코드를 붙여 넣으세요');
      if (!code) return;
      try { COS.importCode(code); toast('기록을 불러왔어요'); sendCos(); renderMe(); } catch (e) { toast('코드를 읽을 수 없어요', true); }
    };
    document.getElementById('logout').onclick = logout;
  }

  // 타이머 막대
  setInterval(() => {
    const el = document.getElementById('timer');
    if (!el) return;
    const v = S.view;
    const bar = el.firstChild;
    if (!v || !v.deadline || !S.room || S.room.status !== 'playing') { bar.style.width = '0%'; el.classList.remove('low'); return; }
    if (!el.dataset.dl || el.dataset.dl !== String(v.deadline)) { el.dataset.dl = v.deadline; el.dataset.total = Math.max(1000, v.deadline - now()); }
    const left = v.deadline - now();
    const pct = Math.max(0, Math.min(100, (left / Number(el.dataset.total)) * 100));
    bar.style.width = pct + '%';
    el.classList.toggle('low', left < 8000);
  }, 200);

  // 시작
  (async function boot() {
    try {
      if (location.protocol === 'file:') throw new Error('file');
      const [cfg, cat] = await Promise.all([api('/api/config'), api('/api/games')]);
      if (!cat || !cat.games) throw new Error('no api');
      S.config = cfg; S.catalog = cat;
    } catch (e) {
      // 서버 없이 열린 경우: 브라우저 안에서 게임 엔진을 돌리는 오프라인 모드
      if (!window.MA_ENGINE) { $app.innerHTML = '<div class="login"><p>서버에 연결할 수 없습니다.</p></div>'; return; }
      S.offline = true;
      S.config = { allowGuest: true, rankedGuest: false, googleClientId: '' };
      S.catalog = window.MA_ENGINE.catalog();
      const nm = lsGet('ma_offname');
      if (nm) { S.token = 'local'; S.user = Local.user(nm); connect(); }
      render();
      return;
    }
    S.token = lsGet('ma_token');
    if (S.token) {
      try { const j = await api('/api/me'); S.user = j.user; connect(); } catch (e) { S.token = null; lsSet('ma_token', null); }
    }
    render();
  })();
})();

</script>
<script>
'use strict';
/* 게임별 화면. GameUI[id](el, view, Kit) 가 매 갱신마다 호출됩니다. */
(function () {
  const G = window.GameUI;
  const K = window.Kit;
  const esc = K.esc;

  // ---------- 공용 조각
  const COLOR_CLASS = { R: 'c-R', B: 'c-B', G: 'c-G', Y: 'c-Y' };
  const SUIT = { R: '●', B: '◆', G: '▲', Y: '■' };
  function pcard(c, small) {
    if (!c) return '<div class="ncard back' + (small ? ' small' : '') + '"></div>';
    return '<div class="ncard' + (small ? ' small' : '') + ' ' + COLOR_CLASS[c.c] + '" style="cursor:default"><span class="s">' + SUIT[c.c] + '</span>' + c.n + '</div>';
  }
  function bind(el, sel, fn) { el.querySelectorAll(sel).forEach((x) => x.addEventListener('click', (e) => fn(x, e))); }
  function mine(id) { return id === K.me(); }
  function fmtTime(ms) { const s = Math.max(0, ms) / 1000; const m = Math.floor(s / 60); return m + ':' + (s % 60).toFixed(1).padStart(4, '0'); }

  function betControls(legal) {
    if (!legal) return '';
    const L = K.local();
    if (L.amt == null || L.amt > legal.maxRaise) L.amt = Math.min(2, legal.maxRaise) || 1;
    const lab = { check: '체크', call: '콜 ' + legal.owe, fold: '폴드', bet: '베팅', raise: '레이즈' };
    let h = '<div class="row" style="margin-top:10px">';
    legal.acts.forEach((a) => {
      if (a === 'bet' || a === 'raise') return;
      h += '<button class="btn' + (a === 'fold' ? ' danger' : ' primary') + '" data-bet="' + a + '">' + lab[a] + '</button>';
    });
    const agg = legal.acts.find((a) => a === 'bet' || a === 'raise');
    if (agg) {
      h += '<div class="row" style="gap:4px"><button class="btn sm" data-amt="-1">−</button><b style="min-width:28px;text-align:center">' + L.amt + '</b><button class="btn sm" data-amt="1">+</button>' +
        '<button class="btn teal" data-bet="' + agg + '">' + lab[agg] + ' ' + (agg === 'raise' ? '+' : '') + L.amt + '</button></div>';
    }
    return h + '</div>';
  }
  function bindBet(el, legal) {
    if (!legal) return;
    const L = K.local();
    bind(el, '[data-amt]', (b) => { L.amt = Math.max(1, Math.min(legal.maxRaise, L.amt + Number(b.dataset.amt))); K.rerender(); });
    bind(el, '[data-bet]', (b) => { const t = b.dataset.bet; K.send(t === 'bet' || t === 'raise' ? { type: t, amount: L.amt } : { type: t }); });
  }

  // =====================================================================
  G.lowcard = function (el, v) {
    const L = K.local();
    const me = K.me();
    if (L.round !== v.round + v.phase) { L.round = v.round + v.phase; L.sel = []; }
    const ids = Object.keys(v.tokens);
    let h = '<div class="row muted small" style="margin-bottom:8px">라운드 ' + v.round + ' / ' + v.rounds + ' · 구간 ' + Math.ceil(v.round / 6) + '</div>';
    h += K.scorebar(ids.map((id) => ({ id, v: v.tokens[id], extra: (v.safe[id] ? '✅생존' : '') + (v.done.includes(id) ? ' ✓' : '') + ' · 구간 ' + v.cycleTokens[id] })));
    if (v.phase === 'pick2') {
      h += K.status(v.myPick2 ? '후보를 냈습니다. 다른 사람을 기다리는 중…' : '후보 카드 2장을 고르세요 (비공개)', !v.myPick2);
      h += '<div class="cards">' + v.hand.map((n) => '<div class="ncard' + (L.sel.includes(n) || (v.myPick2 && v.myPick2.includes(n)) ? ' sel' : '') + (v.myPick2 ? ' dim' : '') + '" data-n="' + n + '">' + n + '</div>').join('') + '</div>';
      if (!v.myPick2) h += '<div class="row" style="margin-top:12px"><button class="btn primary" id="go"' + (L.sel.length === 2 ? '' : ' disabled') + '>후보 2장 내기</button></div>';
    } else if (v.phase === 'pick1') {
      h += K.status(v.myPick1 != null ? '제출 완료. 결과를 기다리는 중…' : '모두의 후보가 공개됐습니다. 최종 카드 1장을 고르세요', v.myPick1 == null);
      h += '<div style="display:grid;gap:8px;margin-bottom:12px">' + Object.keys(v.candidates).map((id) => '<div class="row"><span class="pc" style="background:' + K.pcolor(id) + '"></span><span style="width:90px">' + esc(K.pname(id)) + '</span>' +
        v.candidates[id].map((n) => '<div class="ncard small' + (mine(id) && v.myPick1 === n ? ' sel' : '') + '"' + (mine(id) && v.myPick1 == null ? ' data-p1="' + n + '"' : '') + '>' + n + '</div>').join('') + (v.done.includes(id) ? '<span class="muted small">제출 ✓</span>' : '') + '</div>').join('') + '</div>';
      h += '<div class="muted small">내 손패: ' + v.hand.join(' · ') + '</div>';
    }
    if (v.last) {
      const w = v.last.winner;
      h += '<div class="panel" style="margin-top:14px;padding:12px"><div class="muted small">' + v.last.round + '라운드 제출</div><div class="row" style="margin-top:6px">' +
        Object.keys(v.last.sub).map((id) => '<span class="sb' + (id === w ? ' turn' : '') + '"><span class="pc" style="background:' + K.pcolor(id) + '"></span>' + esc(K.pname(id)) + ' <b class="v">' + v.last.sub[id] + '</b></span>').join('') + '</div>' +
        '<div style="margin-top:6px">' + (w ? '🏅 ' + esc(K.pname(w)) + ' 승리' : '유일한 숫자 없음') + '</div></div>';
    }
    el.innerHTML = h;
    bind(el, '[data-n]', (c) => {
      if (v.myPick2 || v.phase !== 'pick2') return;
      const n = Number(c.dataset.n);
      if (L.sel.includes(n)) L.sel = L.sel.filter((x) => x !== n); else if (L.sel.length < 2) L.sel.push(n); else L.sel = [L.sel[1], n];
      K.rerender();
    });
    bind(el, '#go', () => K.send({ cards: L.sel }));
    bind(el, '[data-p1]', (c) => K.send({ card: Number(c.dataset.p1) }));
  };

  // =====================================================================
  G.timeauction = function (el, v) {
    const L = K.local();
    if (!L.bound) {
      L.bound = true;
      const rel = () => { if (L.pressing) { L.pressing = false; K.send({ type: 'release' }); } };
      window.addEventListener('pointerup', rel);
      window.addEventListener('pointercancel', rel);
      window.addEventListener('blur', rel);
      document.addEventListener('visibilitychange', () => { if (document.hidden) rel(); });
      L.iv = setInterval(() => {
        const t = document.getElementById('ta-clock');
        const vv = window.MA.view;
        if (!t || !vv) return;
        if (vv.phase === 'run' && vv.holding) t.textContent = fmtTime(vv.myBank - (K.now() - vv.t0));
        else t.textContent = fmtTime(vv.myBank);
        const c = document.getElementById('ta-count');
        if (c && vv.phase === 'count') c.textContent = Math.max(0, Math.ceil((vv.deadline - K.now()) / 1000));
      }, 50);
    }
    const ids = Object.keys(v.tokens);
    let msg;
    if (v.phase === 'ready') msg = v.holding ? '준비 완료! 계속 누르고 있으세요 (' + v.readyCount + '명 준비)' : (v.abstain ? '이번 라운드는 포기했습니다' : '버튼을 눌러서 준비하세요');
    else if (v.phase === 'count') msg = v.holding ? '곧 시작! 지금 손을 떼면 이번 라운드 포기' : '이번 라운드는 포기했습니다';
    else if (v.phase === 'run') msg = v.holding ? '경매 진행 중… 시간이 줄어들고 있습니다' : (v.mySpent != null ? '손을 뗐습니다 (' + (v.mySpent / 1000).toFixed(1) + '초 사용)' : '이번 라운드 불참');
    else msg = '경매 종료';
    let h = '<div class="row muted small" style="margin-bottom:8px">라운드 ' + v.round + ' / ' + v.rounds + '</div>';
    h += K.scorebar(ids.map((id) => ({ id, v: v.tokens[id], extra: v.noTime.includes(id) ? '시간 소진' : '' })));
    h += K.status(msg, v.holding);
    h += '<div style="display:grid;place-items:center;gap:14px;padding:16px 0">' +
      '<div class="muted small">내 남은 시간</div><div id="ta-clock" style="font-family:var(--mono);font-size:44px;font-weight:800">' + fmtTime(v.myBank) + '</div>' +
      (v.phase === 'count' ? '<div id="ta-count" style="font-size:28px;color:var(--accent);font-weight:800"></div>' : '') +
      '<button id="ta-btn" class="btn" style="width:200px;height:200px;border-radius:50%;font-size:20px;touch-action:none;' + (v.holding ? 'background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 8px rgba(242,179,61,.2)' : '') + '"' + (v.myBank <= 0 || v.phase === 'end' ? ' disabled' : '') + '>' + (v.holding ? '누르는 중' : '누르기') + '</button>' +
      '<div class="muted small">손가락/마우스를 떼면 그 순간이 기록됩니다</div></div>';
    if (v.lastWinner !== undefined) h += '<div class="muted">지난 라운드 낙찰: <b>' + (v.lastWinner ? esc(K.pname(v.lastWinner)) : '없음') + '</b></div>';
    el.innerHTML = h;
    const btn = document.getElementById('ta-btn');
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (v.phase !== 'ready') return;
      L.pressing = true; K.send({ type: 'press' });
    });
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    if (v.holding && (v.phase === 'count' || v.phase === 'run')) L.pressing = true;
  };

  // =====================================================================
  G.sniperholdem = function (el, v) {
    const L = K.local();
    const me = K.me();
    const h0 = v.hand;
    const ids = Object.keys(v.chips);
    let h = '<div class="row muted small" style="margin-bottom:8px">핸드 ' + v.handNo + ' / ' + v.maxHands + ' · 목표 ' + v.target + '칩</div>';

  G.wallgo = function (el, v) {
    const L = K.local();

    const n = v.n;
    const myTurn = v.turn === me;
    if (L.turnKey !== v.turn + ':' + JSON.stringify(v.pieces)) { L.turnKey = v.turn + ':' + JSON.stringify(v.pieces); L.piece = null; L.to = null; }
    const W = Math.min(56, Math.floor((Math.min(el.clientWidth || 360, 520) - 20) / n));
    const owner = {};
    if (v.phase !== 'place') v.regions.forEach((g) => { if (g.owners.length === 1) g.cells.forEach(([r, c]) => { owner[r + ',' + c] = g.owners[0]; }); });
    const reachSet = {};
    if (myTurn && v.reach && L.piece != null) v.reach[L.piece].forEach(([r, c]) => { reachSet[r + ',' + c] = 1; });
    let svg = '<svg viewBox="-4 -4 ' + (n * W + 8) + ' ' + (n * W + 8) + '" width="' + (n * W + 8) + '" style="max-width:100%;display:block;margin:0 auto;touch-action:manipulation">';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const o = owner[r + ',' + c];
      const fill = o ? K.pcolor(o) : '#1b212b';
      const isReach = reachSet[r + ',' + c];
      const isTo = L.to && L.to[0] === r && L.to[1] === c;
      svg += '<rect data-cell="' + r + ',' + c + '" x="' + (c * W + 1) + '" y="' + (r * W + 1) + '" width="' + (W - 2) + '" height="' + (W - 2) + '" rx="4" fill="' + fill + '" fill-opacity="' + (o ? 0.22 : 1) + '" stroke="' + (isTo ? '#f2b33d' : isReach ? '#4fd1c5' : '#2a3240') + '" stroke-width="' + (isTo || isReach ? 2.5 : 1) + '"/>';
    }
    Object.keys(v.walls).forEach((k) => {
      const [a, b] = k.slice(1).split(',').map(Number);
      const col = K.pcolor(v.walls[k]);
      if (k[0] === 'h') svg += '<line x1="' + (b * W) + '" y1="' + ((a + 1) * W) + '" x2="' + ((b + 1) * W) + '" y2="' + ((a + 1) * W) + '" stroke="' + col + '" stroke-width="6" stroke-linecap="round"/>';
      else svg += '<line x1="' + ((b + 1) * W) + '" y1="' + (a * W) + '" x2="' + ((b + 1) * W) + '" y2="' + ((a + 1) * W) + '" stroke="' + col + '" stroke-width="6" stroke-linecap="round"/>';
    });
    Object.keys(v.pieces).forEach((id) => v.pieces[id].forEach(([r, c], i) => {
      const shown = (mine(id) && L.piece === i && L.to) ? L.to : [r, c];
      svg += K.pieceSvg(K.piece(id), shown[1] * W + W / 2, shown[0] * W + W / 2, W * 0.3, K.pcolor(id), mine(id) && L.piece === i ? '#fff' : '#0d1015', 3, ' data-piece="' + id + ':' + i + '" style="cursor:pointer"');
    }));
    svg += '</svg>';
    let msg;
    if (v.phase === 'place') msg = myTurn ? '말을 놓을 빈칸을 누르세요' : esc(K.pname(v.turn)) + ' 님이 말을 놓는 중';
    else if (v.phase === 'move') {
      if (!myTurn) msg = esc(K.pname(v.turn)) + ' 님 차례';
      else if (L.piece == null) msg = '움직일 내 말을 누르세요';
      else if (!L.to) msg = '이동할 칸을 누르세요 (제자리도 가능)';
      else msg = '벽을 세울 방향을 고르세요';
    } else msg = '게임 종료';
    let h = K.scorebar(v.order.map((id) => ({ id, v: v.phase === 'place' ? null : v.scores[id] + '칸', turn: v.turn === id })));
    h += K.status(msg, myTurn);
    h += svg;
    if (myTurn && v.phase === 'move' && L.to) {
      h += '<div class="row" style="justify-content:center;margin-top:12px">' + [['u', '↑ 위'], ['l', '← 왼쪽'], ['r', '오른쪽 →'], ['d', '↓ 아래']].map(([d, t]) => '<button class="btn" data-wall="' + d + '">' + t + '</button>').join('') + '<button class="btn ghost" id="cancel">취소</button></div>';
    }
    el.innerHTML = h;
    bind(el, '[data-cell]', (c) => {
      if (!myTurn) return;
      const [r, cc] = c.dataset.cell.split(',').map(Number);
